# Builds the Android APK (debug + release) on every push to main, on tags
# and on demand. The APK is attached as a workflow artifact; tags (v1.2.3)
# also get a GitHub Release with the APK for self-installation.
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server URL baked into the app (VITE_SERVER_URL)"
        required: false

jobs:
  test:
    name: Server tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        env:
          # Set the ALON_SERVER_URL repository variable (Settings -> Variables) to
          # bake the production server address into the APK.
          VITE_SERVER_URL: ${{ github.event.inputs.server_url || vars.ALON_SERVER_URL }}
        run: npm run build -w app

      - name: Sync Capacitor
        run: npx -w app cap sync android

      - name: Add google-services.json (push notifications)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/android/app/google-services.json

      - name: Prepare release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APKs
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/alon-netzer-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../../out/alon-netzer-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alon-netzer-apk
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
